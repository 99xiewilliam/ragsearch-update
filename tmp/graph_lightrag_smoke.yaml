base:
  pipeline: graph
  llm_base_url: http://localhost:9000/v1
  module_logs: true
  # 让流程更快：先关掉 LLM 模块
  rewriter_enabled: false
  pruner_enabled: false
  generator_max_tokens: 32

space:
  graph_expand_enabled: [true]
  graph_mode: [global, hybrid]
  graph_builder: [keyword]
  graph_seed_topk: [3]
  graph_neighbor_topk: [20]
  graph_max_expanded: [200]

  embedding_enabled: [true]
  retriever: [cosine]
  retriever_topk: [3]
  # reranker 先关掉，避免下载/耗时
  reranker_enabled: [false]
