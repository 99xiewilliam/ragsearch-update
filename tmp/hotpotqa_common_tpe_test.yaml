# HotPotQA + common pipeline: TPE search test config
#
# This config tests TPE with all modules enabled, including the new compress mode for pruner.
# Designed for a quick convergence test (~50-100 trials).

base:
  pipeline: common
  # Generator: must match the model name/path exposed by your OpenAI-compatible endpoint.
  generator_model: "/home/xwh/models/Qwen3-4B-Instruct-2507"
  generator_max_tokens: 32768
  
  # Force all modules to be enabled (so you can see their logs)
  rewriter_enabled: true
  reranker_enabled: true
  pruner_enabled: true
  # Test the new compress mode
  pruner_mode: compress

space:
  # IMPORTANT (no-download / demo-friendly):
  # Pin to known-available models to avoid timeouts.
  embedder_model: ["BAAI/bge-m3"]
  
  # Unified retrieval knob: 0=cosine, 1=bm25, (0,1)=hybrid
  bm25_weight:
    low: 0.0
    high: 1.0
    steps: 6
  retriever_topk: [3, 5, 10]

  # Chunking
  chunking_enabled: [false, true]
  chunk_size: [256, 512]

  # Query rewrite (enabled in base, but prompt can vary)
  rewriter_prompt_id: ["rewrite_v1", "rewrite_v2_keywords"]

  # Rerank (enabled in base, but model/topk can vary)
  reranker_model: ["none", "/home/xwh/models/ms-marco-MiniLM-L6-v2"]
  rerank_topk: [3, 5, 10]

  # Prune mode can also be searched (but we fix it to compress in base for this test)
  # pruner_mode: ["select", "compress"]  # Uncomment to search both modes
