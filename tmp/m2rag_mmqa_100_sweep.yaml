base:
  # 建议先用 multimodal（能用 caption/图片）；如果你没有 vision 模型，也可以改成 common + only_text 数据。
  pipeline: multimodal
  # llm_base_url 建议用 CLI 传入覆盖：--llm_base_url http://localhost:9000/v1
  module_logs: false

  # generator（建议用 CLI 覆盖，保证与你 vLLM 实际 serve 的 model id 一致）
  generator_max_tokens: 256

space:
  # 通过 space 的单元素列表来“规范地”关闭不需要搜索的模块
  rewriter_enabled: [false]
  pruner_enabled: [false]

  # 重点想看的 retrieval / rerank / chunking 旋钮
  bm25_weight: [0.0, 0.5, 1.0]
  retriever_topk: [3, 5, 10]

  chunking_enabled: [false, true]
  chunk_size: [256, 512]

  reranker_enabled: [false, true]
  reranker_model: ["none", "cross-encoder/ms-marco-MiniLM-L-6-v2"]
  rerank_topk: [3, 5, 10]

  # 可选：让 multimodal pipeline 是否拼接 caption/ocr 等元数据文本
  multimodal_metadata_enabled: [true, false]

