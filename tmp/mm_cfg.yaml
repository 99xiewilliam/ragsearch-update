pipeline: multimodal
# 你已经起了 vLLM
llm_base_url: http://localhost:9000/v1

# multimodal embedding + rerank + VL generator
embedding_enabled: true
retriever: cosine
retriever_topk: 3
embedder_model: /home/xwh/models/Qwen3-VL-Embedding-2B

reranker_enabled: true
reranker_model: /home/xwh/models/Qwen3-VL-Reranker-2B
rerank_topk: 3

# 为了不切碎丢图（image_path 绑定在 chunk 上）
chunking_enabled: false

generator_model: /home/xwh/models/Qwen3-VL-4B-Instruct
generator_max_tokens: 64

module_logs: true