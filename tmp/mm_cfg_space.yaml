base:
  pipeline: multimodal
  llm_base_url: http://localhost:9000/v1
  chunking_enabled: false
  generator_model: /home/xwh/models/Qwen3-VL-4B-Instruct
  generator_max_tokens: 64
  module_logs: true

space:
  # ------- multimodal retrieval -------
  embedding_enabled: [true]
  embedder_model:
    - /home/xwh/models/Qwen3-VL-Embedding-2B
    - /home/xwh/models/Qwen3-VL-Embedding-8B
    - /home/xwh/models/clip-vit-base-patch32
  retriever: [cosine]
  reranker_model:
    - /home/xwh/models/Qwen3-VL-Reranker-2B
    - /home/xwh/models/Qwen3-VL-Reranker-8B
  reranker_enabled: [true]
  rerank_topk: [1, 3, 5]
  retriever_topk: [3]
  hybrid_alpha: [0.5]

  # ------- LLM modules (multimodal defaults) -------
  # 你也可以把它们关掉来减少 vLLM 调用
  rewriter_enabled: [false, true]
  rewriter_model: [qwen3_vl_4b]
  rewriter_max_tokens: [64, 128]

  pruner_enabled: [false, true]
  pruner_model: [qwen3_vl_4b]
  pruner_max_tokens: [64, 128]