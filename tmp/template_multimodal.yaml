base:
  # 1. 环境与基础
  pipeline: multimodal
  llm_base_url: "http://localhost:9000/v1"
  # vLLM /v1/models 的真实 id（必须严格一致，否则 404）
  rewriter_model: "/home/xwh/models/Qwen3-VL-4B-Instruct"
  pruner_model: "/home/xwh/models/Qwen3-VL-4B-Instruct"
  generator_model: "/home/xwh/models/Qwen3-VL-4B-Instruct"
  generator_max_tokens: 128
  module_logs: true

  # 2. 并发设置 (视觉模型并发较小)
  rewriter_max_inflight: 16
  pruner_max_inflight: 8
  generator_max_inflight: 8

space:
  # 固定 pipeline，避免采样到 common 导致 model id 不匹配
  pipeline: ["multimodal"]
  # 3. 核心逻辑开关
  rewriter_enabled: [false, true]
  rewriter_prompt_id: ["rewrite_v1", "rewrite_v2_keywords"]
  
  chunking_enabled: [false, true]
  chunk_size: [256, 512]
  
  embedder_model: ["/home/xwh/models/Qwen3-VL-Embedding-2B"]
  retriever_topk: [3, 5, 10]
  bm25_weight: [0.0, 0.5, 1.0]
  
  reranker_enabled: [false, true]
  reranker_model: ["/home/xwh/models/Qwen3-VL-Reranker-2B"]
  rerank_topk: [3, 5, 10]
  
  pruner_enabled: [true]

  # 4. 多模态特有
  multimodal_metadata_enabled: [true]
